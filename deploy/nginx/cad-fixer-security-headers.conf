# CAD Fixer — cross-origin isolation and security response headers.
#
# Installed on the server as:
#   /etc/nginx/snippets/cad-fixer-security-headers.conf
#
# WHY THIS IS A SNIPPET RATHER THAN FIVE DIRECTIVES IN THE SERVER BLOCK:
#
# nginx inherits `add_header` from a parent context into a `location` ONLY while
# that location defines no `add_header` of its own. The moment a location adds
# one — a Cache-Control, say — EVERY inherited header is dropped, silently.
#
# For CAD Fixer that failure mode is severe and invisible: COOP and COEP would
# stop being sent on /assets/, the browser would withhold SharedArrayBuffer, and
# conservative repair would fail closed — in production only. So every block that
# sets any header re-includes this file. See deploy/nginx/zz-cad-fixer.conf.template.
#
# `always` is required so the headers are also present on error responses; a 404
# must be as isolated as a 200.
#
# THE CONTENT SECURITY POLICY, and the four headers after it, are stated once in
# apps/web/security-headers.ts; scripts/hostinger-deployment.test.ts holds these
# lines to that module, and `vite preview` sends the same values, so the whole
# end-to-end suite runs under them. Stage 5C-1A deferred a CSP because a policy
# that ignored module workers and WebAssembly would break the product in
# production only; PR-01 measured the narrowest policy the product runs under —
# `wasm-unsafe-eval` for the kernels, `connect-src 'self'` for their loaders'
# fetch of their own .wasm — in Chromium and WebKit, and that is what ships.

add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Content-Security-Policy "default-src 'none'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; img-src 'self' data: blob:; font-src 'self'; worker-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=(), hid=()" always;
add_header X-Frame-Options "DENY" always;
