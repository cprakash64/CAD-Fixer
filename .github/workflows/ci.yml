name: CI

on:
  push:
    branches: [main]
  pull_request:

# No secrets are used. Nothing here deploys.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Read from .nvmrc so CI and local development cannot drift. A
          # floating `22` would have silently satisfied itself on a runner whose
          # Node predated the version jsdom's undici requires — the exact class
          # of failure that cost a session when a local shell fell back to
          # Node 20 and the entire jsdom test project was skipped.
          node-version-file: .nvmrc
          cache: npm

      # `npm ci` installs strictly from package-lock.json and fails if the
      # lockfile and manifests disagree.
      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit and component tests
        run: npm test

      - name: Production build
        run: npm run build

  e2e:
    name: End-to-end smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Read from .nvmrc so CI and local development cannot drift. A
          # floating `22` would have silently satisfied itself on a runner whose
          # Node predated the version jsdom's undici requires — the exact class
          # of failure that cost a session when a local shell fell back to
          # Node 20 and the entire jsdom test project was skipped.
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only Chromium: the suite verifies WebGL, module workers, buffer
      # transfer, and cross-origin isolation, none of which need a browser
      # matrix at this stage.
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # playwright.config.ts builds and serves the app itself via webServer.
      - name: Run Playwright tests
        run: npm run test:e2e

      - name: Upload report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
