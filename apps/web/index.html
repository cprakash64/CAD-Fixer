<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Pybrix repairs, converts, splits and textures STL, OBJ and 3MF models in your browser. Models are processed locally and never uploaded."
    />
    <meta name="application-name" content="Pybrix" />
    <!-- The top bar's colour, so the browser chrome continues the application
         chrome rather than breaking it with a stripe of brand blue. -->
    <meta name="theme-color" content="#121b24" />
    <meta name="color-scheme" content="dark" />
    <!-- Same-origin and fingerprinted: Vite emits link icons into /assets/
         (never inlined for rel="icon" / "apple-touch-icon"), so they are
         served immutable, need nothing beyond the policy's img-src 'self',
         and stop the browser asking the server for /favicon.ico. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/src/brand/pybrix-favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/src/brand/pybrix-apple-touch-icon.png" />
    <title>Pybrix — 3D Print Repair &amp; Editing</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
